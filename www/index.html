<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SultanScore</title>
<meta name="theme-color" content="#005A9C">
<style>
:root{
  --bg:#eaf4fa;--card:#fff;--ink:#1b365d;--muted:#5b7286;--line:#d3e6f2;
  --brand:#005a9c;--brand2:#60c1e5;--soft:#d9edf9;--live:#e11d48;--warn:#b45309;--shadow:0 4px 18px rgba(27,54,93,.08);
  --nav:62px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a1c2e;--card:#12293f;--ink:#e6f2fa;--muted:#8fb4cc;--line:#1e3a52;--soft:#16324a;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header.top{flex:none;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg)}
header.top h1{font-size:19px;margin:0}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand img{width:34px;height:34px;object-fit:contain;flex:none}
.tools{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(var(--nav) + env(safe-area-inset-bottom) + 16px)}
nav.tabs{position:fixed;inset-inline:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--card);border-top:1px solid var(--line);z-index:5}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}
nav.tabs button i{font-style:normal;font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs .dot{position:absolute;top:9px;inset-inline-start:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--live);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.datebar{display:flex;align-items:center;gap:6px;margin:2px 0 8px}
.datebar .big{flex:1;text-align:center;font-weight:700;font-size:15px;position:relative}
.datebar .big input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center;padding:0}
.days{display:flex;gap:6px;margin-bottom:8px}
.day{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 0;text-align:center;font:inherit;cursor:pointer}
.day b{display:block;font-size:15px;line-height:1.15}
.day span{font-size:10.5px;color:var(--muted)}
.day.on{background:var(--brand);border-color:var(--brand);color:#fff}
.day.on span{color:#a0e0ef}
.day.today:not(.on){border-color:var(--brand)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.bar{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px;margin:2px 2px 8px}
.league{margin-bottom:12px}
.league h2{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:0 2px 6px;color:var(--muted);font-weight:700}
.league h2 img{width:18px;height:18px;object-fit:contain}
.league h2 .n{background:var(--soft);color:var(--brand);border-radius:999px;padding:0 8px;font-size:12px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.match:active{transform:scale(.99)}
.team{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;font-size:13.5px;font-weight:600}
.team .nm{overflow-wrap:anywhere;line-height:1.25}
.badge{width:38px;height:38px;object-fit:contain;border-radius:8px}
.badge.ph{display:grid;place-items:center;background:var(--soft);color:var(--brand);font-weight:800;font-size:15px}
.mid{text-align:center;min-width:76px}
.time{font-size:20px;font-weight:800;direction:ltr}
.score{font-size:24px;font-weight:800;display:flex;justify-content:center;gap:8px}
.st{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--brand)}
.st.live{background:var(--live);color:#fff;animation:pulse 1.6s infinite}
.st.num{direction:ltr;unicode-bidi:isolate}
.st.warn{background:#fef3c7;color:var(--warn)}
@media (prefers-color-scheme:dark){.st.warn{background:#3a2f12;color:#fbbf24}}
@keyframes pulse{50%{opacity:.65}}
.dt{font-size:11.5px;color:var(--muted);margin-top:2px;direction:ltr}
.scorers{margin-top:4px;display:flex;flex-direction:column;gap:1px;align-items:center}
.scorers .sc{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:132px}
.hero .scorers .sc{font-size:12.5px;max-width:220px}
/* lineup pitch (FotMob-style) */
.pitch{position:relative;width:100%;aspect-ratio:3/4.3;background:linear-gradient(180deg,#43a047,#2e7d32 50%,#43a047);border-radius:16px;overflow:hidden;direction:ltr;margin:8px 0 4px;box-shadow:var(--shadow)}
.pitch::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.06) 0 12.5%,transparent 12.5% 25%)}
.pl-mid{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.9);transform:translateY(-50%)}
.pl-cir{position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;border:2px solid rgba(255,255,255,.9);border-radius:50%;transform:translate(-50%,-50%)}
.pl-box{position:absolute;left:20%;right:20%;height:12%;border:2px solid rgba(255,255,255,.9)}
.pl-box.top{top:0;border-top:0}
.pl-box.bot{bottom:0;border-bottom:0}
.pl-box6{position:absolute;left:34%;right:34%;height:5.5%;border:2px solid rgba(255,255,255,.9)}
.pl-box6.top{top:0;border-top:0}
.pl-box6.bot{bottom:0;border-bottom:0}
.pl-lab{position:absolute;z-index:2;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);padding:2px 7px;border-radius:999px}
.pl-lab.top{top:6px;left:8px}
.pl-lab.bot{bottom:6px;left:8px}
.pdot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:56px;z-index:1}
.pdot .pn{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pdot.hm .pn{background:#005a9c}
.pdot.aw .pn{background:#c0392b}
.pdot .nm{font-size:10px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.pdot .rt{position:absolute;top:-7px;right:2px;background:#fff;color:#111;border-radius:999px;font-size:9px;font-weight:800;padding:1px 5px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.state{text-align:center;color:var(--muted);padding:40px 12px}
.state .big{font-size:40px}
.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:12px;padding:10px 12px;font-size:13px;margin:4px 0 10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.err button{border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.warnbox{background:#fffbeb;color:var(--warn);border:1px solid #fde68a;border-radius:12px;padding:8px 12px;font-size:12.5px;margin:4px 0 10px}
@media (prefers-color-scheme:dark){.err{background:#3a1717;color:#fca5a5;border-color:#5b2323}.warnbox{background:#33290f;border-color:#5a4a1a}}
.skel{height:104px;border-radius:16px;margin-bottom:8px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.search{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:2px 0 10px}
.search:focus{outline:2px solid var(--brand);outline-offset:1px}
.hint{color:var(--muted);font-size:12.5px;margin:0 2px 10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.row .badge{width:34px;height:34px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14.5px}
.row .t span{font-size:12px;color:var(--muted)}
.star{font-size:22px;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px}
.star.on{color:#f59e0b}
h3.sec{font-size:13px;color:var(--muted);margin:14px 2px 8px}
/* overlay (match + team pages) */
#overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column}
#overlay .ohead{flex:none;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--line);background:var(--card)}
#overlay .ohead .ttl{flex:1;min-width:0;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#overlay .obody{flex:1;overflow-y:auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 24px)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 10px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;box-shadow:var(--shadow);margin-bottom:12px}
.hero .badge{width:54px;height:54px}
.hero .score{font-size:34px}
.hero .time{font-size:28px}
.hero .team{font-size:14.5px}
.meta{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:12px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:13.5px;padding:8px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--brand);font-weight:700;box-shadow:var(--shadow)}
.stat{margin-bottom:13px}
.stat .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.stat .l b{min-width:34px}
.stat .l span{color:var(--muted);text-align:center;flex:1}
.stat .l b:last-child{text-align:end}
.bars{display:flex;gap:4px;height:7px}
.bars div{flex:1;background:var(--line);border-radius:4px;overflow:hidden;display:flex}
.bars div.h{justify-content:flex-end}
.bars i{display:block;height:100%;border-radius:4px}
.bars div.h i{background:var(--brand2)}
.bars div.a i{background:#6366f1}
.ev{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:13.5px}
.ev.away{flex-direction:row-reverse;text-align:end}
.ev .m{flex:none;min-width:38px;font-weight:700;color:var(--muted);direction:ltr;text-align:center}
.ev .ic{flex:none;font-size:18px}
.ev .who{flex:1;min-width:0}
.ev .who small{display:block;color:var(--muted);font-size:11.5px}
.setup{padding:40px 22px;text-align:center}
.updatebar{flex:none;margin:0 14px 8px;padding:10px 12px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px}
.updatebar img{width:34px;height:34px;object-fit:contain;flex:none}
.updatebar .ut{flex:1;min-width:0;font-size:13px;line-height:1.35}
.updatebar .ut b{display:block;font-size:14px}
.updatebar button{flex:none;border:0;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;background:#fff;color:var(--brand);cursor:pointer}
.updatebar .ux{flex:none;border:0;background:none;color:#fff;font-size:16px;cursor:pointer;padding:4px}
.setup code{direction:ltr;display:inline-block;background:var(--soft);padding:2px 8px;border-radius:8px}
.league h2{cursor:pointer}
.league h2:active{opacity:.7}
.tbl{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:24px 1fr 28px 48px 34px 62px;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13px}
.trow.head{background:var(--soft);font-weight:700;color:var(--muted);font-size:12px;border:0}
.trow .pos{font-weight:800;text-align:center;color:var(--brand)}
.trow .nm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.trow .nm .badge{width:24px;height:24px}
.trow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow b{text-align:center}
.trow b.pts{font-size:15px}
.srow{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13.5px}
.srow .rank{font-weight:800;text-align:center;color:var(--brand)}
.srow .who b{display:block}
.srow .who span{font-size:12px;color:var(--muted)}
.srow .g{font-weight:800;font-size:18px;text-align:end}
.srow .g small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.xi{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.xi .ev{margin-bottom:0}
.xi .num{flex:none;width:26px;text-align:center;font-weight:800;color:var(--brand)}
.xi .pos{flex:none;width:30px;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.luhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 2px 8px}
.luhead b{font-size:14.5px}
.luhead span{font-size:12.5px;color:var(--muted)}
/* form dots (W green / D grey / L red) and player ratings — our own blue-first style */
.formdots{display:flex;gap:4px;align-items:center}
.fdot{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.fdot.w{background:#16a34a}
.fdot.d{background:#94a3b8}
.fdot.l{background:#e11d48}
.formrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:6px;font-size:13.5px;font-weight:600}
.formrow .formdots{flex:none}
.rating{flex:none;min-width:34px;text-align:center;font-size:12px;font-weight:800;border-radius:999px;padding:2px 7px;background:var(--soft);color:var(--brand)}
.rating.good{background:var(--brand);color:#fff}
.h2hsum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:4px 0 12px}
.h2hsum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.h2hsum b{display:block;font-size:20px;color:var(--brand)}
.h2hsum span{font-size:11.5px;color:var(--muted)}
.trow .formdots{justify-content:flex-end}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><img src="icon.png" alt="SultanScore logo" onerror="this.style.display='none'"><h1 id="title"></h1></div>
    <div class="tools">
      <button id="refBtn" class="chip" type="button" aria-label="refresh">↻</button>
      <button id="langBtn" class="chip" type="button"></button>
    </div>
  </header>
  <div id="updateBar" hidden></div>
  <div class="scroll" id="view"></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="overlay" hidden></div>

<script src="config.js"></script>
<script>
(() => {
'use strict';

const BASE = String((window.APP_CONFIG && window.APP_CONFIG.API_BASE) || '').replace(/\/+$/, '');
const CONFIGURED = /^https?:\/\//.test(BASE) && !/YOUR-WORKER/i.test(BASE);
// Must match package.json and the Worker's LATEST_VERSION.version — bump all three together on every release.
const APP_VERSION = '1.1.0';

const I18N = {

    langBtn: 'English', venue: 'الملعب', round: 'الجولة', goal: 'هدف', own: 'هدف عكسي', penGoal: 'ضربة جزاء', missPen: 'ضربة جزاء ضائعة',
    yellow: 'إنذار', red: 'طرد', sub: 'تبديل', var: 'مراجعة الفيديو', assist: 'تمريرة حاسمة', in: 'دخل', vs: 'ضد',

    noLineups: 'التشكيلات هتظهر قبل المباراة', goals: 'أهداف', assists: 'تمريرات حاسمة', playedShort: 'لعب', pointsShort: 'نقاط', tapLeague: 'اضغط على اسم الدوري لعرض الترتيب والهدافين',
    h2h: 'المواجهات', form: 'المستوى', formShort: 'المستوى', rating: 'التقييم', lastMeetings: 'آخر المواجهات', wins: 'فوز', draws: 'تعادل', losses: 'خسارة',
    noH2h: 'المواجهات المباشرة مش متاحة للمباراة دي', homeWins: 'فوز صاحب الأرض', awayWins: 'فوز الضيف',
    updateT: 'في تحديث جديد!', updateB: 'نزلت نسخة جديدة من SultanScore', updateBtn: 'حمّل التحديث', updateLater: 'بعدين'
  },
  en: {
    title: 'SultanScore', matches: 'Matches', live: 'Live', search: 'Search', myTeams: '⭐ My teams', all: 'All',

const inflight = {};
async function api(path, key) {

  if (key) inflight[key] = ctrl;
  const to = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch(BASE + path, { signal: ctrl.signal });

async function loadMatches(silent) {

  try {
    const [from, to] = dayRange(d);
    const j = await api('/fixtures?from=' + from + '&to=' + to, 'm');
    if (d !== S.date) return;
    S.m = { fixtures: j.fixtures || [], loading: false, error: false, stale: !!j.stale, partial: !!j.partial, at: Date.now() };
  } catch (e) {
    if (e && e.name === 'AbortError' && d !== S.date) return;
    if (d !== S.date) return;
    if (silent && S.m.fixtures.length) return;

let searchTimer = 0;
function searchTerm(q) {
  const n = norm(q);
  if (/[؀-ۿ]/.test(q)) {
    for (const k in ALIASES) if (k.includes(n) || n.includes(k)) return ALIASES[k];
  }
  return q.trim();
}
async function runSearch() {
  const q = S.q.trim();
  if (q.length < 2) { S.teams = []; S.searched = false; S.sLoading = false; S.sError = false; render(); return; }
  const term = searchTerm(q);
  if (term.length < 3) { S.teams = []; S.searched = false; S.sLoading = false; render(); return; }
  S.sLoading = true; S.sError = false; renderSearchResults();
  try {
    const j = await api('/search?q=' + encodeURIComponent(term), 's');
    if (q !== S.q.trim()) return;
    S.teams = j.teams || []; S.searched = true;
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    S.sError = true; S.teams = [];
  }
  S.sLoading = false; renderSearchResults();
}

  st.addEventListener('click', ev => { ev.stopPropagation(); toggleFav(tm); st.className = 'star' + (isFav(tm.id) ? ' on' : ''); st.textContent = isFav(tm.id) ? '★' : '☆'; });

/* ---------- form dots + ratings (FotMob-inspired, our own style) ---------- */
function formDots(form) {
  const wrap = el('div', 'formdots');
  const list = typeof form === 'string' ? form.split('').filter(c => /[WDL]/.test(c)) : (Array.isArray(form) ? form : []);
  list.slice(-5).forEach(c => wrap.appendChild(el('span', 'fdot ' + c.toLowerCase(), c)));
  return wrap;
}
function ratingBadge(rating) {
  if (rating == null || isNaN(+rating)) return null;
  return el('span', 'rating' + (+rating >= 7 ? ' good' : ''), (+rating).toFixed(1));
}
/* ---------- lineup pitch (FotMob-style) ---------- */
// Split a formation like "4-3-3" into its lines, or null when unusable.
function formationRows(formation) {
  const nums = String(formation || '').split('-').map(Number);
  if (nums.length < 2 || nums.length > 5 || nums.some(n => !(n > 0 && n <= 6))) return null;
  if (nums.reduce((a, b) => a + b, 0) !== 10) return null;
  return nums;
}
// Group the XI into rows from the goalkeeper (back) to the forwards.
function pitchSlots(xi, formation) {
  const rank = pl => ({ G: 0, D: 1, M: 2, F: 3 }[String(pl.pos || '').trim().toUpperCase()[0]] ?? 2);
  const byRank = [[], [], [], []];
  [...(xi || [])].forEach(pl => byRank[Math.min(3, rank(pl))].push(pl));
  const rows = formationRows(formation);
  const sizes = rows ? [1, ...rows] : [byRank[0].length, byRank[1].length, byRank[2].length, byRank[3].length].filter(n => n > 0);
  const pool = [...byRank[0], ...byRank[1], ...byRank[2], ...byRank[3]];
  const out = [];
  let k = 0;
  sizes.forEach(n => {
    const row = [];
    for (let i = 0; i < n && k < pool.length; i++) row.push(pool[k++]);
    if (row.length) out.push(row);
  });
  while (k < pool.length) out[out.length - 1].push(pool[k++]);
  return out;
}
function lastName(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  return parts.length ? parts[parts.length - 1] : '—';
}
// Place one team's XI on the pitch: away on top, home at the bottom.
function pitchTeam(pitch, side, isHome) {
  const rows = pitchSlots(side.xi || [], side.formation);
  const n = rows.length || 1;
  rows.forEach((row, ri) => {
    row.forEach((pl, i) => {
      const y = isHome ? 0.99 - ((ri + 0.5) / n) * 0.48 : 0.01 + ((ri + 0.5) / n) * 0.48;
      const x = 0.08 + 0.84 * ((i + 0.5) / row.length);
      const dot = el('div', 'pdot ' + (isHome ? 'hm' : 'aw'));
      dot.style.left = (x * 100).toFixed(1) + '%';
      dot.style.top = (y * 100).toFixed(1) + '%';
      dot.appendChild(el('b', 'pn', pl.number != null ? String(pl.number) : ''));
      dot.appendChild(el('span', 'nm', lastName(pl.player)));
      if (pl.rating != null) dot.appendChild(el('span', 'rt', String(pl.rating)));
      pitch.appendChild(dot);
    });
  });
}

// Auto-refresh while the app is open: live scores every 20s, but ONLY on

// refreshes every 60s, and the live badge every 60s off the Live tab.
let tick = 0;
setInterval(() => {
  if (!CONFIGURED || document.hidden) return;
  tick++;
  if (S.tab === 'live' && !S.stack.length) loadLive(true);
  else if (S.tab !== 'live' && tick % 3 === 0) loadLive(true);  // keeps the live badge fresh (every 60s)
  if (S.tab === 'matches' && !S.stack.length && S.date === todayStr() && tick % 3 === 0 && !S.m.loading) loadMatches(true);
}, 20000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !CONFIGURED) return;
  if (S.tab === 'matches' && S.date === todayStr()) loadMatches(true);
  loadLive(true);
});

render();
if (CONFIGURED) { loadMatches(false); loadLive(true); checkUpdate(); }

// Update check: ask the Worker which version is latest. If it is newer than
// this build, show a banner with the new logo and a download button. The
// user can dismiss it once per version (saved in localStorage), and the
// banner never blocks the matches list if the check fails.
function newerVersion(a, b) {
  const pa = String(a || '').split('.').map(n => +n || 0), pb = String(b || '').split('.').map(n => +n || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) { if ((pa[i] || 0) > (pb[i] || 0)) return true; if ((pa[i] || 0) < (pb[i] || 0)) return false; }
  return false;
}
async function checkUpdate() {
  try {
    const v = await api('/version');
    if (!v || !v.version || !newerVersion(v.version, APP_VERSION)) return;
    if (store.get('mc-update-dismissed', '') === v.version) return;
    const bar = $('updateBar');
    bar.textContent = '';
    const im = document.createElement('img'); im.src = 'icon.png'; im.alt = ''; bar.appendChild(im);
    const tx = el('div', 'ut'); tx.appendChild(el('b', null, t('updateT') + ' v' + v.version));
    const notes = v.notes && (v.notes[lang] || v.notes.en);
    tx.appendChild(document.createTextNode(t('updateB') + (notes ? ' — ' + notes : '')));
    bar.appendChild(tx);
    const go = el('button', null, t('updateBtn')); go.type = 'button';
    go.addEventListener('click', () => { if (v.downloadUrl) window.open(v.downloadUrl, '_blank'); });
    bar.appendChild(go);
    const x = el('button', 'ux', '✕'); x.type = 'button'; x.setAttribute('aria-label', t('updateLater'));
    x.addEventListener('click', () => { store.set('mc-update-dismissed', v.version); bar.hidden = true; bar.textContent = ''; });
    bar.appendChild(x);
    bar.hidden = false;
  } catch (e) { /* no update banner if the server cannot be reached */ }
}
})();
</script>
